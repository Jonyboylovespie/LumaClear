plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = "${project.mod_version}+mc${project.minecraft_version}"
group = project.maven_group

base {
    archivesName = 'lumaclear'
}

repositories {
    maven {
        name = 'CaffeineMC'
        url = 'https://maven.caffeinemc.net/releases'
    }
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/releases'
    }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        'lumaclear' {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Used only to compile and validate the optional Sodium mixins. It is not included in the jar.
    compileOnly "net.caffeinemc:sodium-fabric:${project.sodium_version}"

    // Optional Mod Menu integration. Mod Menu remains a separate mod and is not bundled.
    compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}

// Apply the real mixins before starting Minecraft's window or renderer.
// Run without Sodium, or with -PsmokeSodiumVersion=0.9.2+mc26.3.
sourceSets {
    smoke {
        compileClasspath += sourceSets.main.output + sourceSets.client.output + sourceSets.client.compileClasspath
    }
}

configurations {
    smokeSodium
}

if (providers.gradleProperty('smokeSodiumVersion').isPresent()) {
    dependencies.add('smokeSodium', "net.caffeinemc:sodium-fabric:${providers.gradleProperty('smokeSodiumVersion').get()}")
}

def smokeJar = tasks.register('smokeJar', Jar) {
    archiveClassifier = 'smoke-tests'
    destinationDirectory = layout.buildDirectory.dir('smoke')
    from sourceSets.smoke.output
}

tasks.register('mixinSmokeTest', JavaExec) {
    group = 'verification'
    description = 'Loads and checks the real Fabric mixins without opening a game window.'
    dependsOn tasks.named('jar'), smokeJar
    mainClass = 'net.fabricmc.loader.impl.launch.knot.KnotClient'
    classpath = configurations.clientRuntimeClasspath + configurations.smokeSodium
    systemProperty 'fabric.development', 'true'
    systemProperty 'fabric.defaultModDistributionNamespace', 'official'
    systemProperty 'fabric.defaultMixinRemapType', 'static'
    systemProperty 'fabric.gameVersion', project.minecraft_version
    systemProperty 'java.awt.headless', 'true'
    systemProperty 'mixin.debug.export', 'true'
    systemProperty 'mixin.debug.export.filter', 'net.minecraft.client.renderer.fog.FogRenderer'
    systemProperty 'mixin.debug.export.decompile', 'false'
    doFirst {
        def smokeDir = layout.buildDirectory.dir('mixin-smoke').get().asFile
        smokeDir.mkdirs()
        delete new File(smokeDir, '.mixin.out')
        workingDir smokeDir
        systemProperty 'fabric.addMods', [
                tasks.named('jar').get().archiveFile.get().asFile.absolutePath,
                smokeJar.get().archiveFile.get().asFile.absolutePath
        ].join(File.pathSeparator)
    }
}

tasks.named('check') {
    dependsOn tasks.named('mixinSmokeTest')
}

processResources {
    def version = project.version
    inputs.property 'version', version

    filesMatching('fabric.mod.json') {
        expand version: version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    inputs.property 'projectName', project.name
    from('LICENSE') {
        rename { "${it}_${project.name}" }
    }
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            from components.java
        }
    }
}
